<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face2Face — Sign in</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/home.css">
</head>

<body class="min-h-screen bg-slate-950 text-slate-100 antialiased overflow-x-hidden">
    <div class="pointer-events-none fixed inset-0 bg-glow"></div>

    <main class="relative min-h-screen flex flex-col items-center justify-center px-4 py-10">

        <a href="/" class="flex items-center gap-3 mb-8">
            <span class="flex h-12 w-12 items-center justify-center rounded-2xl bg-brand-500/15 ring-1 ring-brand-500/30">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-brand-400" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m22 8-6 4 6 4V8Z" />
                    <rect width="14" height="12" x="2" y="6" rx="2" ry="2" />
                </svg>
            </span>
            <h1 class="text-3xl font-bold tracking-tight">Face<span class="text-brand-400">2</span>Face</h1>
        </a>

        <div class="w-full max-w-md rounded-2xl bg-slate-900/80 backdrop-blur ring-1 ring-white/10 shadow-2xl shadow-black/50 p-6 sm:p-8">
            <h2 class="text-xl font-semibold mb-1">Sign in</h2>
            <p class="text-sm text-slate-400 mb-6">You need an account to create a room. Joining one only needs a code.</p>

            <form id="login-form" novalidate class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-300 mb-1.5">Email</label>
                    <input id="email" name="email" type="email" autocomplete="username" required
                        class="w-full rounded-xl bg-slate-800/80 px-4 py-3 text-slate-100 placeholder-slate-500 ring-1 ring-white/10 outline-none transition focus:ring-2 focus:ring-brand-500">
                    <p class="field-error mt-1 text-xs text-rose-400" data-for="email"></p>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-300 mb-1.5">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required
                        class="w-full rounded-xl bg-slate-800/80 px-4 py-3 text-slate-100 placeholder-slate-500 ring-1 ring-white/10 outline-none transition focus:ring-2 focus:ring-brand-500">
                    <p class="field-error mt-1 text-xs text-rose-400" data-for="password"></p>
                </div>

                <button id="submit" type="submit"
                    class="w-full rounded-xl bg-brand-600 px-6 py-3 font-semibold text-white transition hover:bg-brand-500 active:scale-[.98] disabled:opacity-50 disabled:cursor-not-allowed">
                    Sign in
                </button>

                <p id="form-error" class="min-h-[1.25rem] text-center text-sm text-rose-400"></p>
            </form>

            <p class="mt-6 text-center text-sm text-slate-400">
                No account? <a href="/signup" class="text-brand-400 hover:text-brand-300 font-medium">Create one</a>
            </p>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/login.js"></script>
</body>

</html>
